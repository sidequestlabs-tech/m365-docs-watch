name: check
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # queued runs must see the latest commit, not the trigger-time one
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - id: run
        continue-on-error: true
        run: python -m notifier.check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in snapshots state.json digest-queue.json; do if [ -e "$f" ]; then git add -A "$f"; fi; done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          CHANGED=$(git diff --cached --name-only -- snapshots | sed 's#snapshots/##; s#\.md$##' | head -20 | tr '\n' ' ')
          git commit -m "check: ${CHANGED:-state update}"
          git pull --rebase
          git push
      - name: Fail if the run had errors
        if: steps.run.outcome == 'failure'
        run: exit 1
