name: digest
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 08:00 EST / 09:00 EDT
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # queued runs must see the latest commit, not the trigger-time one
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - id: run
        continue-on-error: true
        run: python -m notifier.digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in digests digest-queue.json; do if [ -e "$f" ]; then git add -A "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "digest $(date -u +%G-W%V)"
          git pull --rebase
          git push
      - name: Fail if the run had errors
        if: steps.run.outcome == 'failure'
        run: exit 1
