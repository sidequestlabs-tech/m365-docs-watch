[project]
name = "m365-docs-watch"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "markdownify>=0.13", "pyyaml>=6.0", "feedparser>=6.0", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["notifier"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
